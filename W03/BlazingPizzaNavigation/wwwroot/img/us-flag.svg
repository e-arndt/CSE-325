<svg xmlns="http://www.w3.org/2000/svg" width="32" height="17" viewBox="0 0 741 390">
  <!-- White Background / White Stripes -->
  <rect width="741" height="390" fill="#ffffff"/>
  
  <!-- Old Glory Red Stripes -->
  <g fill="#b22234">
    <rect width="741" height="30" y="0"/>
    <rect width="741" height="30" y="60"/>
    <rect width="741" height="30" y="120"/>
    <rect width="741" height="30" y="180"/>
    <rect width="741" height="30" y="240"/>
    <rect width="741" height="30" y="300"/>
    <rect width="741" height="30" y="360"/>
  </g>
  
  <!-- Old Glory Blue Canton -->
  <rect width="296.4" height="210" fill="#3c3b6e"/>
  
  <!-- 50 White Stars -->
  <defs>
    <g id="s">
      <!-- 5-pointed star using a continuous intersecting polygon -->
      <polygon fill="#ffffff" points="0,-12 7.1,9.7 -11.4,-3.7 11.4,-3.7 -7.1,9.7"/>
    </g>
    <!-- Row of 6 stars -->
    <g id="r1">
      <use href="#s" x="24.7" y="21"/>
      <use href="#s" x="74.1" y="21"/>
      <use href="#s" x="123.5" y="21"/>
      <use href="#s" x="172.9" y="21"/>
      <use href="#s" x="222.3" y="21"/>
      <use href="#s" x="271.7" y="21"/>
    </g>
    <!-- Row of 5 stars -->
    <g id="r2">
      <use href="#s" x="49.4" y="42"/>
      <use href="#s" x="98.8" y="42"/>
      <use href="#s" x="148.2" y="42"/>
      <use href="#s" x="197.6" y="42"/>
      <use href="#s" x="247" y="42"/>
    </g>
  </defs>
  
  <use href="#r1"/>
  <use href="#r2"/>
  <use href="#r1" y="42"/>
  <use href="#r2" y="42"/>
  <use href="#r1" y="84"/>
  <use href="#r2" y="84"/>
  <use href="#r1" y="126"/>
  <use href="#r2" y="126"/>
  <use href="#r1" y="168"/>
</svg>
